<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1 class="text-primary text-center">RB</h1>
    <div class="container bg-danger p-3">Fixed width container</div>
    <div class="container-fluid bg-warning p-3">Full width container</div>
    <div class="container">
      <div class="row">
        <div class="col bg-primary text-white p-3">column 1</div>
        <div class="col bg-secondary text-white p-3">column 2</div>
        <div class="col bg-danger text-white p-3">column 3</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
